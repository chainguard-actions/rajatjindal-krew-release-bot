name: Test custom template file path - krew-release-bot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up custom template directory and file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/templates/misc"
          cp "$GITHUB_WORKSPACE/tests/fixtures/krew-template/.krew.yaml" \
             "$GITHUB_WORKSPACE/templates/misc/example.yaml"

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v1.2.3 HEAD 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          krew_template_file: "templates/misc/example.yaml"
          krew_plugin_release_tag: "v1.2.3"

      - name: Assert action ran with custom template path (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom template path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / krew-index PR not possible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
